<!DOCTYPE html>
<html>

<head>

    <title>
        Government Scheme Bot
    </title>

    <style>

        body {

            font-family: Arial;
            background-color: #f4f6f9;
            text-align: center;
            padding-top: 60px;

        }

        .container {

            width: 400px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;

        }

        input {

            width: 90%;
            padding: 12px;
            margin-top: 20px;
            border-radius: 5px;
            border: 1px solid #ccc;

        }

        button {

            margin-top: 20px;
            padding: 12px 25px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;

        }

    </style>

</head>

<body>

    <div class="container">

        <h1>
            Government Scheme Bot
        </h1>

        <p>
            Search government schemes easily
        </p>

        <form action="/search">

            <input
            type="text"
            name="query"
            placeholder="Enter category">

            <br>

            <button type="submit">

                Search

            </button>

        </form>

    </div>

</body>

</html>
